kind = "web"
previewPath = "/"
title = "Ironworks"
version = "1.0.0"
id = "artifacts/ironworks"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20254

[services.development]
run = "pnpm --filter @workspace/ironworks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ironworks", "run", "build" ]
publicDir = "artifacts/ironworks/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20254"
BASE_PATH = "/"
